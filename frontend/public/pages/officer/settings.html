<html>
    <h1>    welcome to the dashboard settings</h1>
    <style>
    /* Restored ARMS inline styles */
    :root{--primary:#1a3a5c;--gold:#e8982a;--text:#1c2a3a;--bg:#eef1f7;--border:#dde4ef;--radius:10px}
    .page-header{background:var(--bg-card);border:1px solid var(--border);box-shadow:0 1px 2px rgba(14,34,64,0.04);padding:18px 20px;border-radius:6px;color:var(--navy)}
    .nav-seal{background:url('/images/coat-of-arms.png') center/contain no-repeat}
    .alert-custom{display:none;padding:10px;border-radius:6px}
    .alert-custom.alert-success{background:#e6f7ed;color:#1e8c4a;border:1px solid #dff2e3}
    .alert-custom.alert-danger{background:#fdecea;color:#c0392b;border:1px solid #f7d3d1}
    .toast-stack{position:fixed;right:18px;bottom:18px;z-index:1200;display:flex;flex-direction:column;gap:8px}
    .btn-primary-custom{background:var(--gold);color:#fff;padding:8px 12px;border-radius:6px;border:none}
    .btn-secondary-custom{background:#f3f6fb;color:var(--text);padding:8px 12px;border-radius:6px;border:1px solid var(--border)}
    .coat-watermark{background:url('/images/coat-of-arms.png') center center no-repeat;opacity:.06}
    </style>
</html>
</html>
